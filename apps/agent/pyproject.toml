[project]
name = "merism-agent"
version = "0.0.0"
description = "Merism LiveKit + Gemini Live interview worker"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "livekit-agents[google,images]~=1.5",
    "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
