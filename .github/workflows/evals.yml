name: Evals

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/evals/**"
      - "apps/web/lib/assistant/**"
      - "apps/functions/analyzeSession/**"
      - "apps/functions/analyzeSurvey/**"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  evals:
    name: nightly eval harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MERISM_EVAL_TESTS: "1"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Run evals
        run: pnpm test:evals
      - name: Locate newest eval report
        id: report
        run: |
          report=$(ls -1t tests/evals/reports/*.json | head -n 1)
          echo "path=$report" >> "$GITHUB_OUTPUT"
          node -e 'const fs=require("fs"); const p=process.argv[1]; const r=JSON.parse(fs.readFileSync(p,"utf8")); const body=`evals: ${r.passed}/${r.totalScenarios} passed, ${r.failed} failed, ${r.skipped} skipped, tokens in=${r.totalTokens.input} out=${r.totalTokens.output}`; console.log(body); fs.writeFileSync("evals-summary.txt", body);' "$report"
      - uses: actions/upload-artifact@v4
        with:
          name: evals-report
          path: ${{ steps.report.outputs.path }}
          retention-days: 90
      - name: Publish latest eval note (best effort)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.existsSync('evals-summary.txt')
              ? fs.readFileSync('evals-summary.txt', 'utf8')
              : 'evals finished, but no summary file was produced.'
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'updated',
              direction: 'desc',
              per_page: 1,
            })
            if (prs.data.length === 0) {
              core.info('No open issue target for eval note.')
              return
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prs.data[0].number,
              body: `Nightly eval summary\n\n${body}`,
            })
