name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel stale runs on PR branches; never cancel main (avoids hiding regressions
# from a hurried push).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Minimum read-only by default; jobs that need write opt in explicitly.
permissions:
  contents: read

jobs:
  js:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Fail-fast order: cheapest checks first. Build is slowest, runs last.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  python:
    # Deleted per ADR-0013 (2026-07-12): the Python worker under apps/agent has
    # been removed and the migration is entirely on Mastra + @mastra/livekit.
    # The `pytest` job used to run `bash scripts/test-py.sh` against apps/agent;
    # both the job and the script are gone. If a future ADR reintroduces Python
    # in this repo, restore this job by re-adding an `astral-sh/setup-uv` step
    # plus the invocation.
    name: pytest (removed post ADR-0013)
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: 'echo "python job intentionally disabled — ADR-0013"'

  scope-guard:
    name: scope guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm scope-guard

  audit:
    name: pnpm audit (high+, prod)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # --audit-level=high: only high/critical advisories block the build.
      # --prod: ignore devDependency noise (test/build tooling).
      - run: pnpm audit --audit-level=high --prod

  semgrep:
    # Pattern-level enforcement (robustness-hardening REQ-1).
    # ERROR-severity rules fail the build; WARNING-severity rules surface
    # in output for cleanup but don't block. See `.semgrep/rules/` and
    # `.kiro/specs/robustness-hardening/` for the rule catalog + rationale.
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet semgrep
      # Two passes:
      #   1) Hard gate: any ERROR-severity finding fails the build.
      #   2) Soft pass: list WARNING-severity findings for review (non-blocking).
      - name: semgrep (ERROR — fail-closed)
        run: semgrep --config .semgrep/rules/ --severity ERROR --error .
      - name: semgrep (WARNING — informational)
        if: always()
        run: semgrep --config .semgrep/rules/ --severity WARNING . || true

  dependency-cruiser:
    # Module-graph boundary enforcement (robustness-hardening REQ-6 +
    # dependency-cruiser-boundaries sub-spec). Companion to semgrep:
    # cruiser owns "module A may not import module B" (graph shape);
    # semgrep owns "this AST pattern is forbidden in source X". Rules
    # are NOT duplicated across layers.
    name: dep-cruiser
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm deps:cruise

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @merism/web exec playwright install --with-deps chromium
      - run: pnpm -F @merism/web build
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  integration:
    name: stack / schema:verify / smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APPWRITE_ENDPOINT: http://localhost:8080/v1
      APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: devsecret-change-me-min-32-chars-long
      QWEN_API_KEY: ci
      DEEPSEEK_API_KEY: ci
      STT_PROVIDER_KEY: ci
      TTS_PROVIDER_KEY: ci
      MERISM_LIVE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Start stack
        run: |
          printenv | grep -E '^(APPWRITE_|LIVEKIT_|QWEN_|DEEPSEEK_|STT_|TTS_|_APP_)' > .env || true
          SMOKE_SKIP_STACK=0 bash scripts/stack-up.sh
      - name: Apply + verify schema
        if: env.APPWRITE_API_KEY != ''
        run: |
          pnpm schema:apply
          pnpm schema:verify
      - name: Smoke + live property tests
        if: env.APPWRITE_API_KEY != ''
        run: |
          SMOKE_SKIP_STACK=1 bash scripts/smoke.sh
          pnpm test:properties
      - name: Upload stack logs on failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml logs > docker-compose.log || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: docker-compose-logs
          path: docker-compose.log
