rules:
  - id: no-secret-in-source
    message: |
      Secret-shaped literal found in source. JWT tokens, Stripe `sk_live_` /
      `sk_test_` keys, and provider API tokens MUST stay in env (`.env*`,
      gitignored) and be read in `main.ts` / SDK-wrapper layers only. Pure-core
      handlers never see raw secrets — they get masked/typed deps.

      If this is a sample / placeholder, move it to `.env.example` with an
      obvious placeholder (`<your-key-here>`) so it doesn't trip the rule.
      If this is a test snapshot, use `<jwt-redacted>` / `<masked>` markers.

      See `.kiro/steering/errors-and-observability.md` § Secret masking.
      Companion: `.kiro/specs/robustness-hardening/` REQ-1.
    severity: ERROR
    languages: [generic]
    paths:
      include:
        - "/apps/**/*.ts"
        - "/apps/**/*.tsx"
        - "/apps/**/*.py"
        - "/packages/**/*.ts"
        - "/tests/**/*.ts"
      exclude:
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - "**/__tests__/**"
        - "**/.env.example"
        - "**/.env*"
        - "**/.semgrep/**"
        - "**/node_modules/**"
        - "**/dist/**"
    pattern-either:
      # JWT (3 base64 segments separated by dots, each at least 20 chars). The
      # eyJ prefix is the literal base64 of `{"a` which all JWT headers start with.
      - pattern-regex: 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'
      # Stripe-style API keys.
      - pattern-regex: 'sk_(live|test)_[A-Za-z0-9]{20,}'
      # OpenAI-style keys (sk-...).
      - pattern-regex: 'sk-[A-Za-z0-9]{40,}'
    metadata:
      docs: ".kiro/steering/errors-and-observability.md#secret-masking-binding"
      category: security
      owner: platform
