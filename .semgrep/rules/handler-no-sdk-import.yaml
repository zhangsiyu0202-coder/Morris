rules:
  - id: handler-no-sdk-import
    message: |
      `apps/functions/*/src/handler.ts` must not import SDKs. Move the
      SDK call to `main.ts`, inject the side-effect via the typed `Deps`
      interface, and have the pure-core `handler.ts` consume the dep.

      See `.kiro/steering/architecture.md` § Function shape (binding).
      Companion: `.kiro/specs/robustness-hardening/` REQ-1.
    severity: ERROR
    languages: [typescript]
    paths:
      include:
        - "apps/functions/*/src/handler.ts"
    pattern-either:
      - pattern: import $X from "node-appwrite"
      - pattern: |
          import { ... } from "node-appwrite"
      - pattern: import $X from "appwrite"
      - pattern: |
          import { ... } from "appwrite"
      - pattern: import $X from "livekit-server-sdk"
      - pattern: |
          import { ... } from "livekit-server-sdk"
      - pattern: import $X from "@livekit/server-sdk"
      - pattern: |
          import { ... } from "@livekit/server-sdk"
    metadata:
      docs: ".kiro/steering/architecture.md#function-shape-binding"
      category: architecture
      owner: platform
